name: CI debug build (m3-expressive)

on:
  workflow_dispatch:
  push:
    branches: ["m3-expressive"]
    paths:
      - 'Android/**'
      - '.github/workflows/ci_m3.yaml'

permissions:
  contents: write

jobs:
  build:
    name: Compile, unit tests, debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK Platform 37.1
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          $SDKM --list 2>/dev/null | grep -E "platforms;android-37" > "$RUNNER_TEMP/sdk-list.txt" || true
          echo "y" | $SDKM "platforms;android-37.1" || echo "y" | $SDKM "platforms;android-37.0"
      - name: Build debug APK and run unit tests
        run: |
          set +e
          ./gradlew :app:assembleDebug --console=plain --stacktrace > "$RUNNER_TEMP/build.log" 2>&1
          echo "ASSEMBLE_EXIT=$?" >> "$RUNNER_TEMP/build.log"
          ./gradlew :app:testDebugUnitTest --console=plain > "$RUNNER_TEMP/test.log" 2>&1
          echo "TEST_EXIT=$?" >> "$RUNNER_TEMP/test.log"
          grep -q "ASSEMBLE_EXIT=0" "$RUNNER_TEMP/build.log"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-debug-apk
          path: Android/src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Publish build summary to ci-logs branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "sha: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID"; echo "time: $(date -u +%FT%TZ)"
            echo "== sdk platforms =="; cat "$RUNNER_TEMP/sdk-list.txt" 2>/dev/null
            echo "== assemble: errors/warnings summary =="
            grep -E "^e: |FAILED|What went wrong|Execution failed|Could not |error:|ASSEMBLE_EXIT|BUILD (SUCCESSFUL|FAILED)" "$RUNNER_TEMP/build.log" | head -150
            echo "== assemble: tail =="; tail -60 "$RUNNER_TEMP/build.log"
            echo "== tests: summary =="
            grep -E "FAILED|tests completed|TEST_EXIT|BUILD (SUCCESSFUL|FAILED)" "$RUNNER_TEMP/test.log" 2>/dev/null | head -60
          } > "$RUNNER_TEMP/summary.txt"
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null || true
          if git rev-parse --verify origin/ci-logs >/dev/null 2>&1; then
            git checkout -q -B ci-logs origin/ci-logs
          else
            git checkout -q --orphan ci-logs && git rm -rq -f . 2>/dev/null || true
          fi
          mkdir -p logs && cp "$RUNNER_TEMP/summary.txt" logs/latest.txt
          git add logs/latest.txt && git commit -q -m "ci summary $GITHUB_SHA" && git push -q origin ci-logs
