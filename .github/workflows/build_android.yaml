name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Verify 64-bit APK size target
        shell: bash
        run: |
          for apk in app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/apk/release/app-x86_64-release.apk; do
            size_bytes=$(stat -c '%s' "$apk")
            echo "$apk: $(( (size_bytes + 500000) / 1000000 )) MB"
            if (( size_bytes > 40000000 )); then
              echo "APK exceeds the 40 MB release target: $apk" >&2
              exit 1
            fi
          done
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk-arm64-v8a
          path: Android/src/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk-armeabi-v7a
          path: Android/src/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk-x86
          path: Android/src/app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk-x86_64
          path: Android/src/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
